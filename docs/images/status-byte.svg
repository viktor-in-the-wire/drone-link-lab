<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 848 290' width='848' height='290' role='img' aria-labelledby='t d'>
<title id='t'>Telemetry status byte</title><desc id='d'>Eight bit cells: bits 7 to 5 hold the flight mode, bits 4 to 0 hold the flags.</desc>
<rect width='848' height='290' fill='#ffffff'/>
<text x='40' y='34' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='18' font-weight='bold' fill='#111827' text-anchor='start' >Telemetry status byte</text>
<text x='40' y='54' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='start' >One byte carries five yes/no flags and a 3-bit flight mode.</text>
<text x='88.0' y='90' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='middle' >bit 7</text>
<rect x='40' y='100' width='96' height='54' rx='4' fill='#dcfce7' stroke='#15803d' stroke-width='1.5'/>
<text x='88.0' y='132.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#111827' text-anchor='middle' >mode</text>
<text x='184.0' y='90' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='middle' >bit 6</text>
<rect x='136' y='100' width='96' height='54' rx='4' fill='#dcfce7' stroke='#15803d' stroke-width='1.5'/>
<text x='184.0' y='132.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#111827' text-anchor='middle' >mode</text>
<text x='280.0' y='90' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='middle' >bit 5</text>
<rect x='232' y='100' width='96' height='54' rx='4' fill='#dcfce7' stroke='#15803d' stroke-width='1.5'/>
<text x='280.0' y='132.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#111827' text-anchor='middle' >mode</text>
<text x='376.0' y='90' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='middle' >bit 4</text>
<rect x='328' y='100' width='96' height='54' rx='4' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.5'/>
<text x='376.0' y='132.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#111827' text-anchor='middle' >FAILSAFE</text>
<text x='472.0' y='90' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='middle' >bit 3</text>
<rect x='424' y='100' width='96' height='54' rx='4' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.5'/>
<text x='472.0' y='132.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#111827' text-anchor='middle' >RETURNING</text>
<text x='568.0' y='90' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='middle' >bit 2</text>
<rect x='520' y='100' width='96' height='54' rx='4' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.5'/>
<text x='568.0' y='132.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#111827' text-anchor='middle' >LOW_BATTERY</text>
<text x='664.0' y='90' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='middle' >bit 1</text>
<rect x='616' y='100' width='96' height='54' rx='4' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.5'/>
<text x='664.0' y='132.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#111827' text-anchor='middle' >GPS_LOCK</text>
<text x='760.0' y='90' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='middle' >bit 0</text>
<rect x='712' y='100' width='96' height='54' rx='4' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.5'/>
<text x='760.0' y='132.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#111827' text-anchor='middle' >ARMED</text>
<path d='M40 162 v6 H328 v-6' fill='none' stroke='#4b5563' stroke-width='1.2'/>
<text x='184.0' y='184' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='middle' >mode (3 bits, values 1-4)</text>
<path d='M328 162 v6 H808 v-6' fill='none' stroke='#4b5563' stroke-width='1.2'/>
<text x='568.0' y='184' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='middle' >flags (1 = on)</text>
<text x='40' y='230' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#111827' text-anchor='start' >mode values:  1 = MANUAL  |  2 = STABILIZE  |  3 = AUTO  |  4 = LOITER</text>
<text x='40' y='252' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='start' >read the mode with  (status &gt;&gt; 5) &amp; 0b111</text>
</svg>
